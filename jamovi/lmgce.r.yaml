---
name:  LMGCE
title: GCE Linear Model
jrs:   '1.1'
refs:
      - GCEstim
      
items:
  - name: text
    title: Status
    type: Html
    
  - name: reference
    title: GCEstim reference
    type: Html

  - name: modelSummary
    title: Model Summary
    type: Table
    columns:
      - name: measure
        title: Measure
        type: text
      - name: value
        title: Value
        type: text

  - name: coefficients
    title: Coefficients
    type: Table
    columns:
      - name: term
        title: Term
        type: text
      
      - name: estimate
        title: Estimate
        type: number
        format: zto
      
      - name: ciLowerZ
        title: CI Lower
        type: number
        format: zto
        visible: (bootstrap == 0)

      - name: ciUpperZ
        title: CI Upper
        type: number
        format: zto
        visible: (bootstrap == 0)
      
      - name: ciLower
        title: Bootstrap CI Lower
        type: number
        format: zto
        visible: (bootstrap)
      
      - name: ciUpper
        title: Bootstrap CI Upper
        type: number
        format: zto
        visible: (bootstrap)
      
      - name: se
        title: Std. Deviation
        type: number
        format: zto
        visible: (bootstrap == 0)

      - name: z
        title: z value
        type: number
        format: zto
        visible: (bootstrap == 0)

      - name: p
        title: p
        type: number
        format: zto,pvalue
        visible: (bootstrap == 0)

  - name: plot1
    title: Estimates and confidence intervals
    type: Image
    renderFun: .plot1
    visible: (plot1)

  - name: plot2
    title: Supports vs prediction error
    type: Image
    renderFun: .plot2
    visible: (plot2)

  - name: plot3
    title: Supports vs estimates
    type: Image
    renderFun: .plot3
    visible: (plot3)

  - name: plot4
    title: Supports vs normalized entropy
    type: Image
    renderFun: .plot4
    visible: (plot4)

  - name: plot5
    title: Supports vs precision error
    type: Image
    renderFun: .plot5
    visible: (plot5)

  - name: plot6
    title: GCE reestimation vs prediction error
    type: Image
    renderFun: .plot6
    visible: (plot6)

  - name: plot7
    title: GCE reestimation vs precision error
    type: Image
    renderFun: .plot7
    visible: (plot7)
    
  - name: plotRidge
    title: Ridge trace
    type: Image
    renderFun: .plotRidge
    visible: (plotRidge && supportMethod == 'ridge')  
...
  
