---
name: RidgeTrace
title: Ridge Trace
jrs: '1.1'
refs:
  - GCEstim
items:
  - name: fitCache
    title: Fitted ridge cache
    type: Table
    visible: false
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
    columns:
      - name: value
        title: "Value"
        type: text
  - name: text
    title: Status
    type: Html
  - name: modelSummary
    title: Model Summary
    type: Table
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
    columns:
      - name: measure
        title: "Measure"
        type: text
      - name: value
        title: "Value"
        type: text
  - name: selectedLambda
    title: Selected Lambda
    type: Table
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
    columns:
      - name: minimum
        title: Minimum Evaluated
        type: number
      - name: maximum
        title: Maximum Evaluated
        type: number
      - name: selected
        title: Selected Lambda
        type: number
      - name: rule
        title: Selection Rule
        type: text
  - name: coefficients
    title: Coefficients at Selected Lambda
    type: Table
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
    columns:
      - name: term
        title: "Coefficient"
        type: text
      - name: estimate
        title: "Estimate"
        type: number
  - name: coefficientRanges
    title: Coefficient Ranges over Evaluated Lambda Grid
    type: Table
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
    columns:
      - name: term
        title: "Coefficient"
        type: text
      - name: minimum
        title: "Minimum"
        type: number
      - name: maximum
        title: "Maximum"
        type: number
      - name: maxAbs
        title: "Maximum absolute"
        type: number
      - name: selected
        title: "Selected estimate"
        type: number
  - name: lambdaResults
    title: Lambda Results
    type: Table
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
      - showLambdaTable
      - tableRows
    columns:
      - name: position
        title: Grid position
        type: integer
      - name: lambda
        title: "Lambda"
        type: number
      - name: sample
        title: "In-sample error"
        type: number
      - name: cvMean
        title: "Mean CV error"
        type: number
      - name: cvSE
        title: "CV SE"
        type: number
      - name: selected
        title: "Selected"
        type: text
      - name: minimum
        title: "Minimum error"
        type: text
      - name: oneSE
        title: "1-SE"
        type: text
    visible: (showLambdaTable)
  - name: plotPaths
    title: Ridge Coefficient Paths
    type: Image
    width: 560
    height: 400
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
      - axisScale
      - showIntercept
      - extrema
      - facet
      - displayTerms
      - plotPaths
    renderFun: .plotPaths
    visible: (plotPaths)
  - name: plotCV
    title: Cross-Validation Error
    type: Image
    width: 560
    height: 400
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - axisScale
      - seBars
      - plotCV
    renderFun: .plotCV
    visible: (plotCV && cv)
  - name: plotSample
    title: In-Sample Error
    type: Image
    width: 560
    height: 400
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
      - axisScale
      - plotSample
    renderFun: .plotSample
    visible: (plotSample:show || (plotSample:auto && !cv))
  - name: plotRanges
    title: Coefficient Ranges
    type: Image
    width: 560
    height: 400
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
      - showIntercept
      - displayTerms
      - plotRanges
    renderFun: .plotRanges
    visible: (plotRanges)
  - name: plotSensitivity
    title: Local Coefficient Sensitivity
    type: Image
    width: 560
    height: 400
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
      - axisScale
      - showIntercept
      - displayTerms
      - plotSensitivity
    renderFun: .plotSensitivity
    visible: (plotSensitivity)
  - name: plotFolds
    title: Fold-Specific CV Errors
    type: Image
    width: 560
    height: 400
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
      - axisScale
      - foldMean
      - plotFolds
    renderFun: .plotFolds
    visible: (plotFolds && cv)
  - name: plotStability
    title: Coefficient Stability Across CV Folds
    type: Image
    width: 560
    height: 400
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - standardize
      - penalizeIntercept
      - customGrid
      - lambdaValues
      - lambdaMin
      - lambdaMax
      - lambdaN
      - cv
      - cvNfolds
      - seed
      - errorMeasure
      - selection
      - manualIndex
      - axisScale
      - showIntercept
      - displayTerms
      - plotStability
    renderFun: .plotStability
    visible: (plotStability && cv)
...
