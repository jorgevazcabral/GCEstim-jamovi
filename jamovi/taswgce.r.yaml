---
name: TASWGCE
title: TASW-GCE Linear Model
jrs:   '1.1'
refs:
      - GCEstim
      
items:
  - name: text
    title: Status
    type: Html

  - name: modelSummary
    title: Model Summary
    type: Table
    columns:
      - name: measure
        title: Measure
        type: text
      - name: value
        title: Value
        type: text
  
  - name: signalSupports
    title: Signal Supports
    type: Table
    columns:
      - name: term
        title: Coefficient
        type: text
      - name: lower
        title: Lower limit
        type: number
      - name: upper
        title: Upper limit
        type: number

  - name: plotCV
    title: Cross-validation error by support combination
    type: Image
    renderFun: .plotCV
    visible: (plotCV)
  
  - name: cvResults
    title: Cross-validation results
    type: Table
    columns:
      - name: signalPoints
        title: Signal support points
        type: integer

      - name: noisePoints
        title: Noise support points
        type: integer

      - name: alpha
        title: Noise weight
        type: number

      - name: errorMeasure
        title: Error measure
        type: number

      - name: cvMean
        title: Cross-validation error
        type: number

      - name: convergence
        title: Converged
        type: text

      - name: time
        title: Time (s)
        type: number
  
  - name: coefficients
    title: Coefficients
    type: Table
    columns:
      - name: term
        title: Term
        type: text
      
      - name: estimate
        title: Estimate
        type: number
      
      - name: ciLower
        title: Lower
        type: number
      
      - name: ciUpper
        title: Upper
        type: number
      
      - name: se
        title: Std. Deviation
        type: number
        visible: (bootstrap == 0)

      - name: z
        title: z value
        type: number
        visible: (bootstrap == 0)

      - name: p
        title: p
        type: number
        format: zto,pvalue
        visible: (bootstrap == 0)

  - name: signalProbabilities
    title: Estimated signal support probabilities (p)
    type: Table
    columns:
      - name: term
        title: Coefficient
        type: text
  
  - name: plot1
    title: Estimates and confidence intervals
    type: Image
    renderFun: .plot1
    visible: (plot1)

  - name: plot2
    title: Supports vs prediction error
    type: Image
    renderFun: .plot2
    visible: (plot2 && supportSignalVectorN > 1)

  - name: plot3
    title: Supports vs estimates
    type: Image
    renderFun: .plot3
    visible: (plot3 && supportSignalVectorN > 1)

  - name: plot4
    title: Supports vs normalized entropy
    type: Image
    renderFun: .plot4
    visible: (plot4 && supportSignalVectorN > 1)

  - name: plot5
    title: Supports vs precision error
    type: Image
    renderFun: .plot5
    visible: (plot5 && supportSignalVectorN > 1)

  - name: plot6
    title: GCE reestimation vs prediction error
    type: Image
    renderFun: .plot6
    visible: (plot6 && twostepsN > 0)

  - name: plot7
    title: GCE reestimation vs precision error
    type: Image
    renderFun: .plot7
    visible: (plot7 && twostepsN > 0)

  - name: plotCombined
    title: Selected model plots
    type: Image
    renderFun: .plotCombined
    visible: false
    
  - name: saveFitted
    type: Output
    title: Fitted values
    varTitle: TASW-GCE fitted
    varDescription: TASW-GCE fitted value for each complete observation
    measureType: continuous  
  
  - name: saveResiduals
    type: Output
    title: Residuals
    varTitle: TASW-GCE residual
    varDescription: TASW-GCE residual for each complete observation
    measureType: continuous
  
  - name: saveW
    type: Output
    title: Estimated noise support probabilities (w)
    varTitle: TASW-GCE w
    varDescription: TASW-GCE noise probability from the selected model
    measureType: continuous
    initInRun: true
...
  
