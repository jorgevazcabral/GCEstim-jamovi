    rows: (min(cvTableRows, length(unique(as.numeric(strsplit(M, ",")[[1]]))) * length(unique(as.numeric(strsplit(J, ",")[[1]]))) * length(unique(as.numeric(strsplit(weight, ",")[[1]])))))
