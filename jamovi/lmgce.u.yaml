title: GCE Linear Model
name: LMGCE
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
            suggested:
              - nominal
              - ordinal
            permitted:
              - factor
  - type: CheckBox
    name: intercept
  - type: ActionButton
    name: run
  - type: CollapseBox
    label: Signal support
    collapsed: false
    children:
      - type: ComboBox
        name: supportMethod
      - type: TextBox
        name: M
        label: Signal support points
        format: number
      - type: TextBox
        name: supportSignalVectorN
        format: number
      - type: TextBox
        name: supportSignalVectorMin
        label: Min. signal support range
        format: number
      - type: TextBox
        name: supportSignalVectorMax
        label: Max. signal support range
        format: number
  - type: CollapseBox
    label: Noise support
    collapsed: false
    children:
      - type: TextBox
        name: J
        label: Noise support points
        format: number
      - type: TextBox
        name: weight
        format: number
      - type: CheckBox
        name: supportNoise3sig
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: ComboBox
        name: method
      - type: TextBox
        name: twostepsN
        format: number
  - type: CollapseBox
    label: Confidence Intervals
    collapsed: true
    children:
      - type: TextBox
        name: bootConfLevel
        label: Bootstrap confidence level
        format: number
      - type: CheckBox
        name: bootstrap
      - type: TextBox
        name: bootB
        label: Number of bootstrap samples (B)
        format: number
        enable: (bootstrap)
      - type: ComboBox
        name: bootMethod
        enable: (bootstrap)
      - type: ComboBox
        name: bootCIMethod
        label: Bootstrap confidence level method
        enable: (bootstrap)
        
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: CheckBox
        name: plot1
      - type: CheckBox
        name: plot2
      - type: CheckBox
        name: plot3
      - type: CheckBox
        name: plot4
      - type: CheckBox
        name: plot5
      - type: CheckBox
        name: plot6
      - type: CheckBox
        name: plot7
      - type: TextBox
        name: trueCoef
        label: True coefficients for precision-error (comma separated)
        format: string
        width: largest
        enable: (plot5 || plot7)
  - type: CollapseBox
    label: Options
    collapsed: true
    children:
      - type: TextBox
        name: cvNfolds
        label: CV folds
        format: number
      - type: ComboBox
        name: errorMeasure
      - type: ComboBox
        name: errorMeasureWhich
      - type: ComboBox
        name: caseGLM
      - type: CheckBox
        name: NormEnt
      - type: CheckBox
        name: OLS
      - type: TextBox
        name: seed
        label: Seed
        format: number
        width: large