title: GCE Linear Model
name: LMGCE
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
            suggested:
              - nominal
              - ordinal
            permitted:
              - factor
  
  - type: CheckBox
    name: intercept
  
  - type: ActionButton
    name: run
  
  - type: CollapseBox
    label: Signal support
    collapsed: false
    children:
      - type: ComboBox
        name: supportMethod
      
      - type: Label
        label: Signal support specification
        children:
          - type: RadioButton
            name: ridgeSignalSupportSymm
            optionName: ridgeSignalSupport
            optionPart: symm
            label: Symmetric

          - type: RadioButton
            name: ridgeSignalSupportAsymm
            optionName: ridgeSignalSupport
            optionPart: asymm
            label: Asymmetric
            enable: (supportMethod:ridge)

      - type: Label
        label: "Note: standardized sinal support is always symmetric."
      
      - type: Label
        label: Ridge trace grid
        children:
          - type: TextBox
            name: ridgeLambdaMin
            label: Minimum lambda
            format: number
            enable: (supportMethod:ridge)

          - type: TextBox
            name: ridgeLambdaMax
            label: Maximum lambda
            format: number
            enable: (supportMethod:ridge)

          - type: TextBox
            name: ridgeLambdaN
            label: Number of lambda values
            format: number
            enable: (supportMethod:ridge)
        
      - type: TextBox
        name: M
        label: Signal support points
        format: number
      
      - type: TextBox
        name: supportSignalVectorN
        format: number
      
      - type: TextBox
        name: supportSignalVectorMin
        label: Min. signal support range
        format: number
      
      - type: TextBox
        name: supportSignalVectorMax
        label: Max. signal support range
        format: number
  
  - type: CollapseBox
    label: Noise support
    collapsed: false
    children:
      - type: TextBox
        name: J
        label: Noise support points
        format: number
      
      - type: TextBox
        name: weight
        format: number
      
      - type: Label
        label: Noise support specification
        children:
          - type: RadioButton
            name: noiseSupportSigma3
            optionName: noiseSupportMethod
            optionPart: sigma3
            label: 3 sigma

          - type: RadioButton
            name: noiseSupportMaxres
            optionName: noiseSupportMethod
            optionPart: maxres
            label: Maximum absolute ridge residuals
            enable: (supportMethod:ridge)

      - type: Label
        label: "Note: standardized-coefficients signal support always uses 3 sigma."
  
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: ComboBox
        name: method
      
      - type: TextBox
        name: twostepsN
        format: number
  - type: CollapseBox
    label: Confidence Intervals
    collapsed: true
    children:
      - type: TextBox
        name: bootConfLevel
        label: Bootstrap confidence level
        format: number
      
      - type: CheckBox
        name: bootstrap
      
      - type: TextBox
        name: bootB
        label: Number of bootstrap samples (B)
        format: number
        enable: (bootstrap)
      
      - type: ComboBox
        name: bootMethod
        enable: (bootstrap)
      
      - type: ComboBox
        name: bootCIMethod
        label: Bootstrap confidence level method
        enable: (bootstrap)
        
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: CheckBox
        name: plot1
      
      - type: CheckBox
        name: plot2
      
      - type: CheckBox
        name: plot3
      
      - type: CheckBox
        name: plot4
      
      - type: CheckBox
        name: plot5
      
      - type: CheckBox
        name: plot6
      
      - type: CheckBox
        name: plot7
      
      - type: CheckBox
        name: plotRidge
        enable: (supportMethod:ridge)
        
      - type: TextBox
        name: trueCoef
        label: True coefficients for precision-error (comma separated)
        format: string
        width: largest
        enable: (plot5 || plot7)
  - type: CollapseBox
    label: Options
    collapsed: true
    children:
      - type: TextBox
        name: cvNfolds
        label: CV folds
        format: number
      - type: ComboBox
        name: errorMeasure
      - type: ComboBox
        name: errorMeasureWhich
      - type: ComboBox
        name: caseGLM
      - type: CheckBox
        name: NormEnt
      - type: CheckBox
        name: OLS
      - type: TextBox
        name: seed
        label: Seed
        format: number
        width: large