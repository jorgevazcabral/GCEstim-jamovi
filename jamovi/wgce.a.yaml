---
name: WGCE
title: W-GCE Linear Model
menuGroup: GCEstim
menuSubgroup: Regression
menuTitle: W-GCE
version: '1.0.0'
jas: '1.2'

options:
  - name: run
    title: Run model
    type: Action

  - name: data
    type: Data

  - name: dep
    title: Dependent Variable
    type: Variable

  - name: covs
    title: Covariates
    type: Variables

  - name: factors
    title: Factors
    type: Variables

  - name: intercept
    title: Include intercept
    type: Bool
    default: true

  - name: supportSignalLowers
    title: Lower limits (comma separated)
    type: String
    default: '-10'

  - name: supportSignalUppers
    title: Upper limits (comma separated)
    type: String
    default: '10'

  - name: M
    title: Signal support points
    type: Integer
    default: 3
    min: 3
    max: 99

  - name: J
    title: Noise support points
    type: Integer
    default: 3
    min: 3
    max: 99

  - name: weight
    title: Noise weight
    type: Number
    default: 0.5
    min: 0
    max: 1

  - name: supportNoise3sig
    title: Use 3 sigma noise support
    type: Bool
    default: true

  - name: supportNoiseMin
    title: Minimum noise support
    type: Number
    default: -10

  - name: supportNoiseMax
    title: Maximum noise support
    type: Number
    default: 10

  - name: method
    title: Optimization method
    type: List
    options:
      - dual.BFGS
      - dual.lbfgsb3c
      - dual.L-BFGS-B
      - dual.lbfgs
      - dual.CG
      - dual.Rcgmin
      - dual.bobyqa
      - dual.newuoa
      - dual.nlminb
      - dual.nlm
      - primal.solnl
      - primal.solnp
    default: dual.BFGS

  - name: caseGLM
    title: General linear model case
    type: List
    options:
      - title: Data
        name: D
      - title: Moment
        name: M
      - title: Normed moment
        name: NM
    default: D

  - name: bootConfLevel
    title: Confidence level
    type: Number
    default: 0.95
    min: 0.50
    max: 0.99

  - name: bootstrap
    title: Bootstrap
    type: Bool
    default: false

  - name: bootB
    title: Number of bootstrap samples
    type: Integer
    default: 100
    min: 10

  - name: bootMethod
    title: Bootstrap method
    type: List
    options:
      - residuals
      - cases
      - wild
    default: residuals

  - name: bootCIMethod
    title: Bootstrap confidence interval method
    type: List
    options:
      - percentile
      - basic
    default: percentile

  - name: OLS
    title: Include OLS in plot
    type: Bool
    default: false

  - name: seed
    title: Seed
    type: Integer
    default: 230676
    min: 1

  - name: plot1
    title: Estimates and confidence intervals
    type: Bool
    default: true

  - name: saveFitted
    title: Fitted values
    type: Output

  - name: saveResiduals
    title: Residuals
    type: Output

  - name: saveW
    title: Estimated noise support probabilities (w)
    type: Output

...
