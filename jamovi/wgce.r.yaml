    type: Table
    visible: false
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - supportSignalLowers
      - supportSignalUppers
      - M
      - J
      - weight
      - uniformSignalPrior
      - signalPriorWeights
      - uniformNoisePrior
      - noisePriorWeights
      - supportNoise3sig
      - supportNoiseMin
      - supportNoiseMax
      - method
      - bootConfLevel
      - bootstrap
      - bootB
      - bootMethod
      - bootCIMethod
      - seed
