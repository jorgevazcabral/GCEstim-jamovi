        title: z value
        type: number
        visible: (bootstrap == 0)
      - name: p
        title: p
        type: number
        format: zto,pvalue
        visible: (bootstrap == 0)

  - name: plot1
    title: Estimates and Confidence Intervals
    type: Image
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - supportSignalLowers
      - supportSignalUppers
      - M
      - J
      - weight
