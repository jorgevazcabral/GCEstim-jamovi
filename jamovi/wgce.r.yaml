      - name: term
        title: Term
        type: text
      - name: estimate
        title: Estimate
        type: number
      - name: ciLower
        title: Lower
        type: number
      - name: ciUpper
        title: Upper
        type: number
      - name: se
        title: SE
        type: number
        visible: (bootstrap == 0)
