    visible: (plot1)

  - name: saveFitted
    type: Output
    title: Fitted values
    varTitle: WGCE fitted
    varDescription: W-GCE fitted value for each complete observation
    measureType: continuous

  - name: saveResiduals
    type: Output
    title: Residuals
    varTitle: WGCE residual
    varDescription: W-GCE residual for each complete observation
    measureType: continuous

  - name: saveW
    type: Output
    title: Estimated noise support probabilities (w)
    varTitle: WGCE w$key
    varDescription: W-GCE noise probability at support point $key
    measureType: continuous
    items: (J)

  - name: signalProbabilities
