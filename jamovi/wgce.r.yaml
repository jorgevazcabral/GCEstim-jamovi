        title: Lower limit
        type: number
      - name: upper
        title: Upper limit
        type: number

  - name: coefficients
    title: Coefficients
    type: Table
    clearWith:
      - data
      - run
      - dep
      - covs
      - factors
      - intercept
      - supportSignalLowers
      - supportSignalUppers
      - M
      - J
      - weight
      - uniformSignalPrior
      - signalPriorWeights
      - uniformNoisePrior
      - noisePriorWeights
      - supportNoise3sig
      - supportNoiseMin
      - supportNoiseMax
      - method
      - bootConfLevel
      - bootstrap
      - bootB
      - bootMethod
      - bootCIMethod
      - seed
