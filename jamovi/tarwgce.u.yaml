title: TARW-GCE Linear Model
name: TARWGCE
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
            suggested:
              - nominal
              - ordinal
            permitted:
              - factor
  
  - type: CheckBox
    name: intercept
  
  - type: ActionButton
    name: run
  
  - type: CollapseBox
    label: Signal support
    collapsed: false
    children:
      
      - type: Label
        label: Signal support specification
        children:
          - type: RadioButton
            name: ridgeSignalSupportSymm
            optionName: ridgeSignalSupport
            optionPart: symm
            label: Symmetric

          - type: RadioButton
            name: ridgeSignalSupportAsymm
            optionName: ridgeSignalSupport
            optionPart: asymm
            label: Asymmetric
      
      - type: Label
        label: Ridge trace grid
        children:
          
          - type: TextBox
            name: ridgeLambdaMin
            label: Minimum lambda
            format: number

          - type: TextBox
            name: ridgeLambdaMax
            label: Maximum lambda
            format: number

          - type: TextBox
            name: ridgeLambdaN
            label: Number of lambda values
            format: number
        
      - type: TextBox
        name: M
        label: Signal support points (comma separated)
        format: string
        width: largest
      
      - type: TextBox
        name: supportSignalVectorN
        format: number
      
      - type: TextBox
        name: supportSignal
        label: Signal support value
        format: number
  
      - type: TextBox
        name: supportSignalVectorMin
        label: Min. signal support range
        format: number

      - type: TextBox
        name: supportSignalVectorMax
        label: Max. signal support range
        format: number
  
  - type: CollapseBox
    label: Noise support
    collapsed: false
    children:
      
      - type: TextBox
        name: J
        label: Noise support points (comma separated)
        format: string
        width: largest
      
      - type: TextBox
        name: weight
        label: Noise weight values (comma separated)
        format: string
        width: largest
      
      - type: Label
        label: Noise support specification
        children:
          - type: RadioButton
            name: noiseSupportSigma3
            optionName: noiseSupportMethod
            optionPart: sigma3
            label: 3 sigma

          - type: RadioButton
            name: noiseSupportMaxres
            optionName: noiseSupportMethod
            optionPart: maxres
            label: Maximum absolute ridge residuals
  
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: ComboBox
        name: method
      
      - type: TextBox
        name: twostepsN
        format: number
  - type: CollapseBox
    label: Confidence Intervals
    collapsed: true
    children:
      - type: TextBox
        name: bootConfLevel
        label: Confidence level
        format: number
      
      - type: CheckBox
        name: bootstrap
      
      - type: TextBox
        name: bootB
        label: Number of bootstrap samples (B)
        format: number
        enable: (bootstrap)
      
      - type: ComboBox
        name: bootMethod
        enable: (bootstrap)
      
      - type: ComboBox
        name: bootCIMethod
        label: Bootstrap confidence level method
        enable: (bootstrap)
        
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      
      - type: CheckBox
        name: plotRidge
        
      - type: CheckBox
        name: plotCV
      
      - type: CheckBox
        name: plot1
      
      - type: CheckBox
        name: plot2
      
      - type: CheckBox
        name: plot3
      
      - type: CheckBox
        name: plot4
      
      - type: CheckBox
        name: plot5
      
      - type: CheckBox
        name: plot6
      
      - type: CheckBox
        name: plot7
        
      - type: TextBox
        name: trueCoef
        label: True coefficients for precision-error (comma separated)
        format: string
        width: largest
        enable: (plot5 || plot7)
  
  - type: CollapseBox
    label: Options
    collapsed: true
    children:
      - type: TextBox
        name: cvNfolds
        label: CV folds
        format: number
      
      - type: TextBox
        name: cvTableRows
        label: CV results to display
        format: number
      
      - type: ComboBox
        name: errorMeasure
      
      - type: ComboBox
        name: errorMeasureWhich
      
      - type: ComboBox
        name: caseGLM
      
      - type: CheckBox
        name: NormEnt
      
      - type: CheckBox
        name: OLS
      
      - type: TextBox
        name: seed
        label: Seed
        format: number
        width: large