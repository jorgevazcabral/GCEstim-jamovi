title: TASW-GCE Linear Model
name: TASWGCE
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
            suggested:
              - continuous
            permitted:
              - numeric
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
            suggested:
              - nominal
              - ordinal
            permitted:
              - factor
  
  - type: CheckBox
    name: intercept
  
  - type: CheckBox
    name: run
    
  - type: CollapseBox
    label: Signal Support
    collapsed: false
    children:
      
      - type: Label
        label: "Signal supports are symmetric and based on standardized coefficients."

      - type: TextBox
        name: M
        label: Signal support points (comma separated)
        format: string
        width: largest
      
      - type: Label
        label: 'One or more odd integers at least 3; e.g., 3, 9, 15.'
      - type: TextBox
        name: supportSignalVectorN
        format: number
      
      - type: TextBox
        name: supportSignal
        label: Flexibility parameter (single support space)
        format: number
      
      - type: TextBox
        name: supportSignalVectorMin
        label: Minimum flexibility parameter
        format: number
      
      - type: TextBox
        name: supportSignalVectorMax
        label: Maximum flexibility parameter
        format: number
  
  - type: CollapseBox
    label: Noise Support
    collapsed: false
    children:
      
      - type: TextBox
        name: J
        label: Noise support points (comma separated)
        format: string
        width: largest
      
      - type: Label
        label: 'One or more odd integers at least 3; e.g., 3, 5, 7.'
      - type: TextBox
        name: weight
        label: Noise weight values (comma separated)
        format: string
        width: largest
      
      - type: Label
        label: 'Values from 0 to 1; e.g., 0.1, 0.5, 0.9.'
      - type: Label
        label: "Noise supports use 3 sigma."
  
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: ComboBox
        name: method
      - type: TextBox
        name: twostepsN
        format: number
      - type: TextBox
        name: seed
        label: Seed
        format: number
        width: large
  - type: CollapseBox
    label: Cross-Validation
    collapsed: true
    children:
      - type: TextBox
        name: cvNfolds
        label: CV folds
        format: number
      - type: ComboBox
        name: errorMeasure
      - type: ComboBox
        name: errorMeasureWhich
      - type: TextBox
        name: cvTableRows
        label: CV results to display
        format: number
  - type: CollapseBox
    label: Confidence Intervals
    collapsed: true
    children:
      - type: TextBox
        name: bootConfLevel
        label: Confidence level
        format: number
      
      - type: CheckBox
        name: bootstrap
      
      - type: TextBox
        name: bootB
        label: Number of bootstrap samples (B)
        format: number
        enable: (bootstrap)
      
      - type: ComboBox
        name: bootMethod
        enable: (bootstrap)
      
      - type: ComboBox
        name: bootCIMethod
        enable: (bootstrap)
        
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: Label
        label: Selected model
        children:
          - type: CheckBox
            name: plot1

      - type: Label
        label: Support-space grid
        children:
          - type: CheckBox
            name: plot2
          - type: CheckBox
            name: plot3
          - type: CheckBox
            name: plot4
          - type: CheckBox
            name: plot5

      - type: Label
        label: Re-estimation
        children:
          - type: CheckBox
            name: plot6
          - type: CheckBox
            name: plot7

      - type: Label
        label: Tuning
        children:
          - type: CheckBox
            name: plotCV

      - type: Label
        label: Plot options
        children:
          - type: CheckBox
            name: OLS
          - type: CheckBox
            name: NormEnt
          - type: TextBox
            name: trueCoef
            label: True coefficients for precision-error plots (comma separated)
            format: string
            width: largest
            enable: (plot5 || plot7)
        
  - type: CollapseBox
    label: Save
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Output
            name: saveFitted
          - type: Output
            name: saveResiduals
          - type: Output
            name: saveW
